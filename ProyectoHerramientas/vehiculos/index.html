<div layout:decorate="~{layouts/main-layout}">
    <div layout:fragment="content" class="container mt-5 shadow-none">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Catálogo y Flota de Vehículos</h2>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/vehiculos/crear}" class="btn btn-primary">
                Registrar Nuevo
            </a>
        </div>

        <!-- 1. PANEL DE BÚSQUEDA Y FILTRO PARA ADMINISTRADORES -->
        <div sec:authorize="hasRole('ADMIN')" class="card bg-light mb-4 shadow-sm">
            <div class="card-body">
                <form th:action="@{/vehiculos}" method="get" class="row g-3 align-items-end">
                    
                    <!-- Buscador por Placa -->
                    <div class="col-md-5">
                        <label for="searchPlaca" class="form-label fw-bold text-secondary">Buscar por Placa</label>
                        <input type="text" id="searchPlaca" name="placa" th:value="${paramPlaca}" 
                               class="form-control" placeholder="Ej: ABC-123 (Placa)">
                    </div>
                    
                    <!-- Buscador por Estado -->
                    <div class="col-md-5">
                        <label for="searchEstado" class="form-label fw-bold text-secondary">Estado del Auto</label>
                        <select id="searchEstado" name="estado" class="form-select">
                            <option value="TODOS" th:selected="${paramEstado == 'TODOS'}">-- Ver Todos los Estados --</option>
                            <option value="Disponible" th:selected="${paramEstado == 'Disponible'}">Disponible</option>
                            <option value="Alquilado" th:selected="${paramEstado == 'Alquilado'}">Alquilado</option>
                            <option value="Mantenimiento" th:selected="${paramEstado == 'Mantenimiento'}">En Mantenimiento</option>
                        </select>
                    </div>
                    
                    <!-- Botones de Acción Admin -->
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Buscar
                        </button>
                        <a th:href="@{/vehiculos}" class="btn btn-secondary" title="Limpiar filtro">
                            <i class="bi bi-arrow-clockwise"></i>
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- 2. BLOQUE DE BÚSQUEDA PARA CLIENTES (Logueados o Anónimos) -->
        <div sec:authorize="!hasRole('ADMIN')" class="card bg-light mb-4 shadow-sm">
            <div class="card-body">
                <form th:action="@{/vehiculos}" method="get" class="row g-3 align-items-end">
                    
                    <!-- Buscador por Marca -->
                    <div class="col">
                        <label for="searchMarca" class="form-label fw-bold text-secondary">¿Qué marca de auto buscas?</label>
                        <input type="text" id="searchMarca" name="marca" th:value="${paramMarca}" 
                               class="form-control" placeholder="Ej: Toyota, Hyundai, Nissan...">
                    </div>
                    
                    <!-- Botones de Acción Cliente -->
                    <div class="col-auto d-flex gap-2">
                        <button type="submit" class="btn btn-success px-4">
                            <i class="bi bi-search"></i> Buscar Vehículo
                        </button>
                        <a th:href="@{/vehiculos}" class="btn btn-secondary" title="Ver todos">
                            <i class="bi bi-arrow-clockwise"></i>
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- GRILLA DE VEHÍCULOS -->
        <div class="row">
            <div class="col-md-4 mb-4" th:each="v : ${vehiculos}">
                <div class="card h-100 shadow-sm position-relative">
                    
                    <!-- Etiqueta de Estado flotante (Solo para el Administrador) -->
                    <div sec:authorize="hasRole('ADMIN')" class="position-absolute top-0 end-0 m-2">
                        <span th:if="${v.estado == 'Disponible'}" class="badge bg-success shadow-sm">Disponible</span>
                        <span th:if="${v.estado == 'Alquilado'}" class="badge bg-warning text-dark shadow-sm">Alquilado</span>
                        <span th:if="${v.estado == 'Mantenimiento'}" class="badge bg-danger shadow-sm">Mantenimiento</span>
                    </div>

                    <img th:src="${v.imagenUrl != null ? v.imagenUrl : 'https://via.placeholder.com/300x200?text=Vehiculo+Disponible'}"
                        class="card-img-top" alt="Imagen del vehículo" style="height: 200px; object-fit: cover;">

                    <div class="card-body">
                        <h5 class="card-title" th:text="${v.marca + ' ' + v.modelo}">Marca Modelo</h5>
                        <ul class="list-unstyled">
                            <!-- Nota: La placa es un dato sensible/técnico, si prefieres que el cliente tampoco la vea en la tarjeta, puedes envolver este <li> en un sec:authorize="hasRole('ADMIN')" -->
                            <li sec:authorize="hasRole('ADMIN')"><strong>Placa:</strong> <span class="text-monospace fw-bold" th:text="${v.placa}"></span></li>
                            <li><strong>Color del auto:</strong> <span th:text="${v.color}"></span></li>
                            <li><strong>Kilometraje:</strong> <span th:text="${#numbers.formatInteger(v.kilometraje, 1, 'POINT')}">0</span> Km</li>
                            <li><strong>Precio por día:</strong> S/<span th:text="${#numbers.formatDecimal(v.precioPorDia, 1, 2)}"></span></li>
                        </ul>
                        
                        <!-- Acciones del Cliente -->
                        <div sec:authorize="!hasRole('ADMIN')" class="mt-3 d-grid">
                            <a sec:authorize="isAuthenticated()" th:href="@{/vehiculos/ver/{id}(id=${v.id})}"
                                class="btn btn-success">
                                <i class="bi bi-key"></i> Alquilar ahora
                            </a>
                            <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-outline-success">
                                Inicia sesión para alquilar
                            </a>
                        </div>
                    </div>

                    <!-- Acciones del Administrador -->
                    <div sec:authorize="hasRole('ADMIN')"
                        class="card-footer bg-white border-top-0 d-flex justify-content-between pb-3">
                        <a th:href="@{/vehiculos/actualizar/{id}(id=${v.id})}"
                            class="btn btn-outline-warning btn-sm px-3">Editar</a>
                        <form th:action="@{/vehiculos/eliminar/{id}(id=${v.id})}" method="post"
                            onsubmit="return confirm('¿Estás seguro de eliminar este vehículo?')">
                            <button type="submit" class="btn btn-outline-danger btn-sm px-3">Eliminar</button>
                        </form>
                    </div>
                </div>
            </div>
            
            
            <!-- Mensaje alternativo si la lista regresa vacía al filtrar -->
            <div th:if="${#lists.isEmpty(vehiculos)}" class="col-12 text-center py-5">
                <i class="bi bi-car-front text-muted" style="font-size: 3rem;"></i>
                <p class="text-muted mt-3 fs-5">No se encontraron vehículos disponibles con los filtros seleccionados.</p>
            </div>
        </div>
        
    </div>
</div>
<!-- Fin de la vista de vehiculos - Actualizado -->
