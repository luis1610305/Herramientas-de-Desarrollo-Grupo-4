<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Chofer | Alquiler de Autos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .section-title {
            border-left: 4px solid #0d6efd;
            padding-left: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body class="d-flex align-items-center py-5" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Crear Cuenta</h2>
                            <p class="text-muted">Únete a nuestra flota de conductores</p>
                        </div>

                        <form th:action="@{/login/crearCuenta}" th:object="${registroDTO}" method="post">

                            <h5 class="section-title text-primary">Datos Personales</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej. Juan"
                                        th:classappend="${#fields.hasErrors('nombre') ? 'is-invalid' : ''}">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                                        th:errors="*{nombre}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Apellido</label>
                                    <input type="text" th:field="*{apellido}" class="form-control"
                                        placeholder="Ej. Pérez"
                                        th:classappend="${#fields.hasErrors('apellido') ? 'is-invalid' : ''}">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}"
                                        th:errors="*{apellido}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">DNI</label>
                                    <input type="text" th:field="*{dni}" class="form-control"
                                        placeholder="Documento de Identidad"
                                        th:classappend="${#fields.hasErrors('dni') ? 'is-invalid' : ''}">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}"
                                        th:errors="*{dni}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Licencia de Conducir</label>
                                    <input type="text" th:field="*{licenciaConducir}" class="form-control"
                                        placeholder="N° de Licencia">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono</label>
                                    <input type="tel" th:field="*{telefono}" class="form-control"
                                        placeholder="999 999 999"
                                        th:classappend="${#fields.hasErrors('telefono') ? 'is-invalid' : ''}">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}"
                                        th:errors="*{telefono}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Fecha de Nacimiento</label>
                                    <input type="date" th:field="*{fechaNacimiento}" class="form-control"
                                        th:classappend="${#fields.hasErrors('fechaNacimiento') ? 'is-invalid' : ''}">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaNacimiento')}"
                                        th:errors="*{fechaNacimiento}"></div>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label">Dirección</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-geo-alt-fill"></i></span>
                                        <input type="text" th:field="*{direccion}" class="form-control"
                                            placeholder="Ej. Av. Ejército 123, Arequipa"
                                            th:classappend="${#fields.hasErrors('direccion') ? 'is-invalid' : ''}">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('direccion')}"
                                            th:errors="*{direccion}"></div>
                                    </div>
                                </div>
                            </div>

                            <h5 class="section-title text-primary">Datos de Cuenta</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Correo Electrónico</label>
                                    <div class="input-group">
                                        <span class="input-group-text">@</span>
                                        <input type="email" th:field="*{email}" class="form-control"
                                            placeholder="correo@ejemplo.com"
                                            th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                            th:errors="*{email}"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nombre de Usuario</label>
                                <input type="text" th:field="*{username}" class="form-control" placeholder="jperez123"
                                    th:classappend="${#fields.hasErrors('username') ? 'is-invalid' : ''}">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                    th:errors="*{username}"></div>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Contraseña</label>
                                <input type="password" th:field="*{password}" class="form-control"
                                    placeholder="••••••••"
                                    th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}">
                                <div class="form-text">Usa al menos 8 caracteres para mayor seguridad.</div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                    th:errors="*{password}"></div>
                            </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                            <i class="bi bi-person-check"></i> Registrarse ahora
                        </button>
                        <a th:href="@{/login}" class="btn btn-link text-decoration-none">¿Ya tienes cuenta? Inicia
                            sesión</a>
                    </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
