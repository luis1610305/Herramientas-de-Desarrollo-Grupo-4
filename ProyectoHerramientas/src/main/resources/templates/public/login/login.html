<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar | Mi Tienda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{app.css}" href="app.css">
</head>

<body class="bg-light d-flex align-items-center" style="min-height:100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-3 text-center">Iniciar sesión</h1>
            <div th:if="${param.error}" class="alert alert-danger py-2">
              Usuario o contraseña incorrectos.
            </div>
            <div th:if="${param.registrado}" class="alert alert-success alert-dismissible fade show" role="alert">
              <i class="bi bi-check-circle-fill"></i>
              <strong>¡Registro exitoso!</strong> Ahora puedes iniciar sesión con tus credenciales.
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${param.logout}" class="alert alert-success py-2">
              Has cerrado sesión correctamente.
            </div>

            <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}">Error</div>

            <form th:action="@{/login}" method="post" class="d-grid gap-3">
              <div>
                <label id="email" class="form-label">E-mail</label>
                <input type="text" id="email" name="email" class="form-control" placeholder="E-mail"
                  required>
              </div>
              <div>
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
              </div>
              <button class="btn btn-primary w-100">Iniciar Sesion</button>
            </form>

            <div class="text-center mt-3">
              <a class="text-decoration-none small" th:href="@{/vehiculos}">← Volver al inicio / </a>
              <a class="text-decoration-none small" th:href="@{/login/crearCuenta}">¿No tienes una cuenta? Registrate</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
