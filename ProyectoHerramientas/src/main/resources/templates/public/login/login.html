<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar | Mi Tienda</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{app.css}" href="app.css">
</head>

<body class="bg-gradient bg-light d-flex align-items-center" style="min-height: 100vh; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="card-body p-4 p-sm-5">
            
            <div class="text-center mb-4">
              <div class="inline-block p-3 bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px; display: inline-flex; align-items: center; justify-content: center;">
                <i class="bi bi-shield-lock-fill fs-4"></i>
              </div>
              <h1 class="h4 fw-bold text-dark mb-1">Bienvenido de nuevo</h1>
              <p class="text-muted small">Ingresa a tu cuenta</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2 small rounded-3 shadow-sm">
              <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuario o contraseña incorrectos.
            </div>
            
            <div th:if="${param.registrado}" class="alert alert-success alert-dismissible fade show small rounded-3 shadow-sm" role="alert">
              <i class="bi bi-check-circle-fill me-1"></i>
              <strong>¡Registro exitoso!</strong> Ahora puedes iniciar sesión con tus credenciales.
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${param.logout}" class="alert alert-success py-2 small rounded-3 shadow-sm">
              <i class="bi bi-box-arrow-right me-1"></i> Has cerrado sesión correctamente.
            </div>

            <div class="alert alert-danger py-2 small rounded-3 shadow-sm" th:if="${error}" th:text="${error}">Error</div>

            <form th:action="@{/login}" method="post" class="d-grid gap-3">
              <div>
                <label id="email" class="form-label fw-semibold small text-secondary">E-mail</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="text" id="email" name="email" class="form-control bg-light border-start-0 ps-0 py-2 shadow-none" placeholder="nombre@ejemplo.com" required>
                </div>
              </div>
              
              <div>
                <label class="form-label fw-semibold small text-secondary">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                  <input type="password" name="password" class="form-control bg-light border-start-0 ps-0 py-2 shadow-none" placeholder="••••••••" required>
                </div>
              </div>

              <button class="btn btn-primary py-2 fw-semibold shadow-sm mt-2">Iniciar Sesión</button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
              <div class="d-flex justify-content-between align-items-center">
                <a class="text-decoration-none small text-muted hover-primary" th:href="@{/vehiculos}">
                  <i class="bi bi-arrow-left"></i> Volver
                </a>
                <a class="text-decoration-none small fw-semibold text-primary" th:href="@{/login/crearCuenta}">
                  Crear cuenta
                </a>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
